<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rankify — Community Curated Rankings</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-color: #f8fafc;
            --text-muted: #94a3b8;
            --accent: #3b82f6;
            --accent-hover: #2563eb;
            --border: #334155;
            --danger: #ef4444;
            --expert: #f59e0b;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        header {
            border-bottom: 1px solid var(--border);
            padding: 1.5rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(15, 23, 42, 0.8);
            backdrop-filter: blur(8px);
            position: sticky;
            top: 0;
            z-index: 10;
        }

        .logo {
            font-size: 1.5rem;
            font-weight: 800;
            color: var(--accent);
            text-decoration: none;
            letter-spacing: -0.5px;
            cursor: pointer;
        }

        .btn {
            background-color: var(--accent);
            color: white;
            border: none;
            padding: 0.6rem 1.2rem;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
        }

        .btn:hover {
            background-color: var(--accent-hover);
        }

        .btn-outline {
            background: transparent;
            border: 1px solid var(--border);
            color: var(--text-color);
        }

        .btn-outline:hover {
            background: var(--border);
        }

        main {
            max-width: 900px;
            margin: 2rem auto;
            padding: 0 1rem;
            flex: 1;
            width: 100%;
        }

        .search-container {
            margin-bottom: 2rem;
        }

        .search-bar {
            width: 100%;
            padding: 1rem 1.2rem;
            background-color: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 12px;
            color: var(--text-color);
            font-size: 1rem;
            outline: none;
            transition: border-color 0.2s;
        }

        .search-bar:focus {
            border-color: var(--accent);
        }

        .empty-state {
            background: var(--card-bg);
            border: 1px dashed var(--border);
            border-radius: 16px;
            padding: 3rem 2rem;
            text-align: center;
            margin-top: 1.5rem;
        }

        .empty-state h3 {
            font-size: 1.25rem;
            margin-bottom: 0.5rem;
        }

        .empty-state p {
            color: var(--text-muted);
            margin-bottom: 1.5rem;
        }

        .empty-actions {
            display: flex;
            gap: 1rem;
            justify-content: center;
            flex-wrap: wrap;
        }

        .feed {
            display: flex;
            flex-direction: column;
            gap: 1.2rem;
        }

        .card {
            background-color: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 14px;
            padding: 1.5rem;
            cursor: pointer;
            transition: transform 0.15s, border-color 0.15s;
        }

        .card:hover {
            border-color: var(--accent);
            transform: translateY(-2px);
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 0.8rem;
        }

        .card-title {
            font-size: 1.2rem;
            font-weight: 700;
        }

        .tag {
            font-size: 0.75rem;
            background: rgba(59, 130, 246, 0.15);
            color: var(--accent);
            padding: 0.25rem 0.6rem;
            border-radius: 20px;
            font-weight: 600;
        }

        .card-preview {
            color: var(--text-muted);
            font-size: 0.95rem;
            margin-bottom: 1rem;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .card-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.85rem;
            color: var(--text-muted);
        }

        .view {
            display: none;
        }

        .view.active {
            display: block;
        }

        .form-group {
            margin-bottom: 1.2rem;
        }

        .form-group label {
            display: block;
            margin-bottom: 0.5rem;
            font-weight: 600;
            font-size: 0.9rem;
        }

        .form-control {
            width: 100%;
            padding: 0.8rem;
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 8px;
            color: var(--text-color);
            font-size: 0.95rem;
            outline: none;
        }

        .form-control:focus {
            border-color: var(--accent);
        }

        .items-list {
            display: flex;
            flex-direction: column;
            gap: 0.6rem;
            margin-bottom: 1rem;
        }

        .item-row {
            display: flex;
            gap: 0.5rem;
            align-items: center;
        }

        .item-row span {
            font-weight: bold;
            color: var(--text-muted);
            min-width: 20px;
        }

        .delete-item {
            background: transparent;
            border: none;
            color: var(--danger);
            cursor: pointer;
            font-weight: bold;
            padding: 0.5rem;
        }

        .back-btn {
            background: none;
            border: none;
            color: var(--accent);
            cursor: pointer;
            font-size: 0.95rem;
            font-weight: 600;
            margin-bottom: 1rem;
            display: inline-flex;
            align-items: center;
            gap: 0.4rem;
        }

        .detail-items {
            list-style: none;
            margin-top: 1.5rem;
            display: flex;
            flex-direction: column;
            gap: 0.8rem;
        }

        .detail-item-card {
            background: rgba(15, 23, 42, 0.4);
            border: 1px solid var(--border);
            padding: 1rem;
            border-radius: 10px;
            display: flex;
            align-items: center;
            gap: 1rem;
        }

        .rank-number {
            font-size: 1.2rem;
            font-weight: 800;
            color: var(--accent);
            min-width: 30px;
        }

        .requests-section {
            margin-top: 2.5rem;
            border-top: 1px solid var(--border);
            padding-top: 1.5rem;
        }

        .requests-title {
            font-size: 1.1rem;
            margin-bottom: 1rem;
            color: var(--text-muted);
        }

        .request-pill {
            display: inline-block;
            background: rgba(239, 68, 68, 0.1);
            color: #f87171;
            padding: 0.4rem 0.8rem;
            border-radius: 8px;
            font-size: 0.85rem;
            margin: 0.3rem;
            border: 1px solid rgba(239, 68, 68, 0.2);
        }

        .comments-section {
            margin-top: 2.5rem;
            border-top: 1px solid var(--border);
            padding-top: 1.5rem;
        }

        .comment-card {
            background: var(--card-bg);
            border: 1px solid var(--border);
            padding: 0.8rem 1rem;
            border-radius: 8px;
            margin-top: 0.8rem;
            font-size: 0.95rem;
        }

        .comment-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 0.3rem;
        }

        .comment-author {
            font-weight: 700;
            color: var(--accent);
            font-size: 0.9rem;
        }

        .expert-badge {
            font-size: 0.7rem;
            background: rgba(245, 158, 11, 0.15);
            color: var(--expert);
            border: 1px solid rgba(245, 158, 11, 0.3);
            padding: 0.1rem 0.4rem;
            border-radius: 4px;
            font-weight: 700;
            margin-left: 0.5rem;
        }

        .author-info {
            font-size: 0.85rem;
            color: var(--text-muted);
            margin-bottom: 1rem;
        }
    </style>
</head>
<body>

    <header>
        <a class="logo" onclick="switchView('feed')">Rankify ⚡</a>
        <button class="btn" onclick="switchView('create')">+ Create List</button>
    </header>

    <main>
        <!-- FEED VIEW -->
        <div id="feed-view" class="view active">
            <div class="search-container">
                <input type="text" id="searchInput" class="search-bar" placeholder="Search rankings (e.g., Movies, Coffee, Sports)..." oninput="handleSearch()">
            </div>
            
            <div id="contentArea"></div>

            <div id="requestsSection" class="requests-section" style="display:none;">
                <h3 class="requests-title">🔥 Missing Ratings Requested by Community:</h3>
                <div id="requestsList"></div>
            </div>
        </div>

        <!-- CREATE VIEW -->
        <div id="create-view" class="view">
            <button class="back-btn" onclick="switchView('feed')">← Back to Feed</button>
            <h2>Create New Ranking</h2>
            <br>
            <form id="createForm" onsubmit="saveList(event)">
                <div class="form-group">
                    <label>Your Nickname (Author)</label>
                    <input type="text" id="authorName" class="form-control" placeholder="e.g. TacticalMaster" required>
                </div>
                <div class="form-group">
                    <label>List Title</label>
                    <input type="text" id="listTitle" class="form-control" placeholder="e.g. Best Wingers in Football" required>
                </div>
                <div class="form-group">
                    <label>Category Tag</label>
                    <input type="text" id="listTag" class="form-control" placeholder="e.g. Sports" required>
                </div>
                <div class="form-group">
                    <label>Short Description</label>
                    <textarea id="listDesc" class="form-control" rows="2" placeholder="Briefly describe what this list is about..." required></textarea>
                </div>
                <div class="form-group">
                    <label>Ranked Items (Type your items)</label>
                    <div id="itemsContainer" class="items-list">
                        <div class="item-row">
                            <span>1.</span>
                            <input type="text" class="form-control item-input" placeholder="Item name" required>
                        </div>
                        <div class="item-row">
                            <span>2.</span>
                            <input type="text" class="form-control item-input" placeholder="Item name" required>
                        </div>
                        <div class="item-row">
                            <span>3.</span>
                            <input type="text" class="form-control item-input" placeholder="Item name" required>
                        </div>
                    </div>
                    <button type="button" class="btn btn-outline" onclick="addItemField()">+ Add Another Item</button>
                </div>
                <button type="submit" class="btn" style="width: 100%; margin-top: 1rem;">Publish Ranking</button>
            </form>
        </div>

        <!-- DETAIL VIEW -->
        <div id="detail-view" class="view">
            <button class="back-btn" onclick="switchView('feed')">← Back to Feed</button>
            <div id="detailContent"></div>
        </div>
    </main>

    <script>
        let lists = JSON.parse(localStorage.getItem('rankify_data')) || [];
        let requests = JSON.parse(localStorage.getItem('rankify_requests')) || [];

        function saveToStorage() {
            localStorage.setItem('rankify_data', JSON.stringify(lists));
            localStorage.setItem('rankify_requests', JSON.stringify(requests));
        }

        // Проверка: является ли автор экспертом в категории (если у него суммарно больше 5 лайков в ней)
        function checkIsExpert(author, category) {
            if (!author || author === 'Anonymous') return false;
            const userLists = lists.filter(l => l.author.toLowerCase() === author.toLowerCase() && l.tag.toLowerCase() === category.toLowerCase());
            const totalLikes = userLists.reduce((sum, l) => sum + l.likes, 0);
            return totalLikes >= 5; // Порог для получения статуса эксперта
        }

        function switchView(viewName) {
            document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
            if(viewName === 'feed') {
                document.getElementById('feed-view').classList.add('active');
                renderFeed(lists);
            } else if(viewName === 'create') {
                document.getElementById('create-view').classList.add('active');
                document.getElementById('createForm').reset();
                resetItemFields();
            }
            window.scrollTo(0,0);
        }

        function renderFeed(dataToRender, searchTerm = '') {
            const container = document.getElementById('contentArea');
            const reqSection = document.getElementById('requestsSection');
            
            if(dataToRender.length === 0) {
                container.innerHTML = `
                    <div class="empty-state">
                        <h3>No rankings found for "${searchTerm}"</h3>
                        <p>Be the first to create this ranking or ask the community to make it!</p>
                        <div class="empty-actions">
                            <button class="btn" onclick="openCreateWithQuery('${searchTerm}')">Create Ranking</button>
                            <button class="btn btn-outline" onclick="sendRatingRequest('${searchTerm}')">Request from Community</button>
                        </div>
                    </div>
                `;
            } else {
                container.innerHTML = `<div class="feed">` + dataToRender.map(list => {
                    const isExpert = checkIsExpert(list.author, list.tag);
                    return `
                        <div class="card" onclick="openDetail(${list.id})">
                            <div class="card-header">
                                <div class="card-title">${list.title}</div>
                                <span class="tag">${list.tag}</span>
                            </div>
                            <div class="card-preview">${list.desc}</div>
                            <div class="author-info">
                                By @${list.author} ${isExpert ? '<span class="expert-badge">🔥 Top ' + list.tag + ' Expert</span>' : ''}
                            </div>
                            <div class="card-footer">
                                <span>❤️ ${list.likes} likes • ${list.items.length} items</span>
                                <span>View List →</span>
                            </div>
                        </div>
                    `;
                }).join('') + `</div>`;
            }

            if(requests.length > 0) {
                reqSection.style.display = 'block';
                document.getElementById('requestsList').innerHTML = requests.map(r => `<span class="request-pill">📌 ${r}</span>`).join('');
            } else {
                reqSection.style.display = 'none';
            }
        }

        function handleSearch() {
            const query = document.getElementById('searchInput').value.toLowerCase().trim();
            if(!query) {
                renderFeed(lists);
                return;
            }
            const filtered = lists.filter(l => 
                l.title.toLowerCase().includes(query) || 
                l.tag.toLowerCase().includes(query) ||
                l.desc.toLowerCase().includes(query) ||
                l.author.toLowerCase().includes(query)
            );
            renderFeed(filtered, query);
        }

        function openCreateWithQuery(query) {
            switchView('create');
            if(query) {
                document.getElementById('listTitle').value = query.charAt(0).toUpperCase() + query.slice(1);
            }
        }

        function sendRatingRequest(query) {
            if(!query) return;
            if(!requests.includes(query)) {
                requests.push(query);
                saveToStorage();
                alert(`Request for "${query}" sent to the community!`);
                document.getElementById('searchInput').value = '';
                renderFeed(lists);
            }
        }

        function addItemField() {
            const container = document.getElementById('itemsContainer');
            const count = container.children.length + 1;
            const row = document.createElement('div');
            row.className = 'item-row';
            row.innerHTML = `
                <span>${count}.</span>
                <input type="text" class="form-control item-input" placeholder="Item name" required>
                <button type="button" class="delete-item" onclick="this.parentElement.remove(); updateIndices();">×</button>
            `;
            container.appendChild(row);
        }

        function resetItemFields() {
            document.getElementById('itemsContainer').innerHTML = `
                <div class="item-row">
                    <span>1.</span>
                    <input type="text" class="form-control item-input" placeholder="Item name" required>
                </div>
                <div class="item-row">
                    <span>2.</span>
                    <input type="text" class="form-control item-input" placeholder="Item name" required>
                </div>
                <div class="item-row">
                    <span>3.</span>
                    <input type="text" class="form-control item-input" placeholder="Item name" required>
                </div>
            `;
        }

        function updateIndices() {
            const rows = document.querySelectorAll('#itemsContainer .item-row');
            rows.forEach((row, idx) => {
                row.querySelector('span').innerText = (idx + 1) + '.';
            });
        }

        function saveList(e) {
            e.preventDefault();
            const author = document.getElementById('authorName').value.trim() || 'Anonymous';
            const title = document.getElementById('listTitle').value.trim();
            const tag = document.getElementById('listTag').value.trim();
            const desc = document.getElementById('listDesc').value.trim();
            const itemInputs = document.querySelectorAll('.item-input');
            
            const items = Array.from(itemInputs).map(input => input.value).filter(val => val.trim() !== '');

            const newList = {
                id: Date.now(),
                author,
                title,
                tag,
                desc,
                items,
                likes: 0,
                comments: []
            };

            lists.unshift(newList);
            saveToStorage();
            switchView('feed');
        }

        function openDetail(id) {
            const list = lists.find(l => l.id === id);
            if(!list) return;

            if(!list.comments) list.comments = [];
            const isExpert = checkIsExpert(list.author, list.tag);

            document.getElementById('detailContent').innerHTML = `
                <span class="tag" style="margin-bottom: 0.8rem; display: inline-block;">${list.tag}</span>
                <h2>${list.title}</h2>
                <div class="author-info" style="margin: 0.5rem 0 1rem 0;">
                    Created by <strong>@${list.author}</strong> ${isExpert ? '<span class="expert-badge">🔥 Top ' + list.tag + ' Expert</span>' : ''}
                </div>
                <p style="color: var(--text-muted); margin-bottom: 1.5rem;">${list.desc}</p>
                
                <button class="btn btn-outline" onclick="likeList(${list.id})">❤️ Like this ranking (${list.likes})</button>

                <ul class="detail-items">
                    ${list.items.map((item, idx) => `
                        <li class="detail-item-card">
                            <div class="rank-number">#${idx + 1}</div>
                            <div style="font-size: 1.1rem; font-weight: 600;">${item}</div>
                        </li>
                    `).join('')}
                </ul>

                <div class="comments-section">
                    <h3>💬 Discussion (${list.comments.length})</h3>
                    <br>
                    <div class="form-group">
                        <input type="text" id="commentAuthor" class="form-control" placeholder="Your nickname (e.g. Alex)" style="margin-bottom: 0.6rem;">
                        <textarea id="commentText" class="form-control" rows="2" placeholder="Write your thoughts or arguments..."></textarea>
                        <button class="btn" style="margin-top: 0.8rem;" onclick="addComment(${list.id})">Post Comment</button>
                    </div>
                    <div id="commentsList">
                        ${list.comments.length === 0 ? '<p style="color: var(--text-muted);">No comments yet. Be the first to share your opinion!</p> : 
                          list.comments.map(c => `
                            <div class="comment-card">
                                <div class="comment-header">
                                    <span class="comment-author">@${c.author}</span>
                                </div>
                                <div>${c.text}</div>
                            </div>
                          `).join('')}
                    </div>
                </div>
            `;
            document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
            document.getElementById('detail-view').classList.add('active');
            window.scrollTo(0,0);
        }

        function likeList(id) {
            const list = lists.find(l => l.id === id);
            if(list) {
                list.likes++;
                saveToStorage();
                openDetail(id);
            }
        }

        function addComment(id) {
            const authorInput = document.getElementById('commentAuthor');
            const textInput = document.getElementById('commentText');
            
            const author = authorInput.value.trim() || 'Anonymous';
            const text = textInput.value.trim();
            if(!text) return;

            const list = lists.find(l => l.id === id);
            if(list) {
                if(!list.comments) list.comments = [];
                list.comments.push({ author, text });
                saveToStorage();
                openDetail(id);
            }
        }

        renderFeed(lists);
    </script>
</body>
</html>
